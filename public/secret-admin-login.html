<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в Систему</title>
    <!-- Если у тебя файл со стилями называется по-другому, поменяй href="style.css" на свой -->
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* Немного базовых стилей, чтобы по центру было */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111; /* Темный фон в стиле PRISON */
            color: #fff;
            margin: 0;
            font-family: sans-serif;
        }
        .login-box {
            background: #222;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #444;
        }
        input {
            padding: 10px;
            margin: 10px 0;
            width: 80%;
            background: #333;
            color: white;
            border: 1px solid #555;
        }
        button {
            padding: 10px 20px;
            background: #555;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #777;
        }
        #error-msg {
            color: #ff4444;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>ДОСТУП АДМИНА</h2>
        <input type="password" id="password" placeholder="Введите секретный ключ">
        <br>
        <button onclick="login()">Войти</button>
        <p id="error-msg">Неверный пароль или доступ запрещен</p>
    </div>

    <script>
        async function login() {
            const password = document.getElementById('password').value;
            
            // Отправляем пароль на наш сервер
            const res = await fetch('/api/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            
            if (res.ok) {
                // Если пароль верный, сервер выдает сессию, а мы уходим на главную страницу
                window.location.href = '/'; 
            } else {
                // Если пароль не подошел — показываем ошибку
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
